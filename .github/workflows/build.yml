name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Get version
        id: get_version
        run: echo "version=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Find jar
        id: find_jar
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "Found: $JAR"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: MightyMiner v${{ steps.get_version.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## MightyMiner V2 — 1.21.10 Fabric Port
            
            **Requires:** Fabric Loader 0.16+, Fabric API, Minecraft 1.21.10
            
            Drop the `.jar` into your `.minecraft/mods` folder.
            
            Built from commit ${{ github.sha }}
          files: ${{ steps.find_jar.outputs.jar }}
          draft: false
          prerelease: false
